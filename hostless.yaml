build:
  system: docker
  min_cpu: 1
  max_cpu: 4
  min_memory: 1024
  max_memory: 4096

dockerfile_path: "./Dockerfile"
start_command: "node --max-old-space-size=64 index.js"

scaling:
  min_replicas: 1
  max_replicas: 1
  min_cpu: 0.1
  max_cpu: 0.5
  min_memory: 128
  max_memory: 1024

health_check:
  type: tcp
  interval_in_seconds: 15
